---
- name: Verify MinIO end-to-end behavior
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load MinIO binary checksum metadata
      ansible.builtin.include_vars:
        file: "../../vars/binary_checksums.yml"

    - name: Load MinIO role variables
      ansible.builtin.include_vars:
        file: "../../vars/main.yml"

    - name: Set MinIO architecture for verification
      ansible.builtin.set_fact:
        _anro_minio_verify_arch: >-
          {{
            {
              'x86_64': 'amd64',
              'aarch64': 'arm64'
            }[ansible_architecture]
          }}
  vars:
    minio_root_user: molecule-root
    minio_root_password: molecule-only-password-change-me
    minio_server_bin: /usr/local/bin/minio
    minio_client_bin: /usr/local/bin/mc
    minio_server_envfile: /etc/default/minio
    minio_server_user: minio
    minio_server_group: minio
    _verify_alias: molecule
    _verify_bucket: ansible-molecule-e2e
    _verify_source: /tmp/minio-e2e-source
    _verify_result: /tmp/minio-e2e-result
    _verify_content: "anro_minio molecule end-to-end verification\n"
  tasks:
    - name: Gather MinIO service facts
      ansible.builtin.service_facts:

    - name: Verify MinIO service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['minio.service'].state == 'running'
          - ansible_facts.services['minio.service'].status == 'enabled'

    - name: Stat installed MinIO server binary
      ansible.builtin.stat:
        path: "{{ minio_server_bin }}"
        checksum_algorithm: sha256
      register: anro_minio_verify_server_binary

    - name: Stat installed MinIO client binary
      ansible.builtin.stat:
        path: "{{ minio_client_bin }}"
        checksum_algorithm: sha256
      register: anro_minio_verify_client_binary

    - name: Verify binaries are executable and match vendored checksums
      ansible.builtin.assert:
        that:
          - anro_minio_verify_server_binary.stat.exists
          - anro_minio_verify_server_binary.stat.isreg
          - anro_minio_verify_server_binary.stat.executable
          - anro_minio_verify_client_binary.stat.exists
          - anro_minio_verify_client_binary.stat.isreg
          - anro_minio_verify_client_binary.stat.executable
          - >-
            anro_minio_verify_server_binary.stat.checksum ==
            _anro_minio_binary_checksums[_anro_minio_verify_arch].minio
          - >-
            anro_minio_verify_client_binary.stat.checksum ==
            _anro_minio_binary_checksums[_anro_minio_verify_arch].mc
        fail_msg: >-
          Installed MinIO binaries do not match the vendored binaries
          for {{ _anro_minio_verify_arch }}.

    - name: Read MinIO environment file metadata
      ansible.builtin.stat:
        path: "{{ minio_server_envfile }}"
      register: anro_minio_verify_envfile

    - name: Verify credential file permissions
      ansible.builtin.assert:
        that:
          - anro_minio_verify_envfile.stat.mode == '0640'
          - anro_minio_verify_envfile.stat.pw_name == 'root'
          - anro_minio_verify_envfile.stat.gr_name == minio_server_group

    - name: Verify MinIO readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9000/minio/health/ready
        method: GET
        status_code: 200
      register: anro_minio_verify_health
      retries: 20
      delay: 1
      until: anro_minio_verify_health.status == 200

    - name: Verify systemd hardening properties
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - minio.service
          - --property=NoNewPrivileges
          - --property=PrivateTmp
          - --property=ProtectSystem
      register: anro_minio_verify_systemd
      changed_when: false

    - name: Assert systemd hardening is active
      ansible.builtin.assert:
        that:
          - "'NoNewPrivileges=yes' in anro_minio_verify_systemd.stdout"
          - "'PrivateTmp=yes' in anro_minio_verify_systemd.stdout"
          - "'ProtectSystem=strict' in anro_minio_verify_systemd.stdout"

    - name: Set node-specific MinIO verification variables
      ansible.builtin.set_fact:
        _anro_minio_verify_bucket: >-
          molecule-{{ inventory_hostname | lower | regex_replace('[^a-z0-9-]', '-') }}
        _anro_minio_verify_object: "object.txt"
        _anro_minio_verify_content: >-
          MinIO Molecule E2E test from {{ inventory_hostname }}

    - name: Configure local MinIO client
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - alias
          - set
          - molecule
          - "http://127.0.0.1:9000"
          - "{{ minio_root_user }}"
          - "{{ minio_root_password }}"
      changed_when: false
      no_log: true

    - name: Create node-specific test bucket
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - mb
          - --ignore-existing
          - "molecule/{{ _anro_minio_verify_bucket }}"
      register: anro_minio_verify_bucket_create
      changed_when: "'created successfully' in anro_minio_verify_bucket_create.stdout"

    - name: Create node-specific source object
      ansible.builtin.copy:
        content: "{{ _anro_minio_verify_content }}"
        dest: /tmp/minio-molecule-source.txt
        owner: root
        group: root
        mode: "0600"

    - name: Upload node-specific object
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - cp
          - /tmp/minio-molecule-source.txt
          - >-
            molecule/{{ _anro_minio_verify_bucket }}/{{ _anro_minio_verify_object }}
      changed_when: true

    - name: Verify node-specific object exists
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - stat
          - >-
            molecule/{{ _anro_minio_verify_bucket }}/{{ _anro_minio_verify_object }}
      register: anro_minio_verify_object_stat
      changed_when: false

    - name: Download node-specific object
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - cp
          - >-
            molecule/{{ _anro_minio_verify_bucket }}/{{ _anro_minio_verify_object }}
          - /tmp/minio-molecule-downloaded.txt
      changed_when: true

    - name: Read downloaded node-specific object
      ansible.builtin.slurp:
        src: /tmp/minio-molecule-downloaded.txt
      register: anro_minio_verify_downloaded_object

    - name: Verify downloaded node-specific object
      ansible.builtin.assert:
        that:
          - >-
            anro_minio_verify_downloaded_object.content | b64decode ==
            _anro_minio_verify_content
        fail_msg: >-
          Object downloaded through {{ inventory_hostname }} does not match
          the object uploaded through the same cluster endpoint.

    - name: Remove node-specific object
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - rm
          - >-
            molecule/{{ _anro_minio_verify_bucket }}/{{ _anro_minio_verify_object }}
      changed_when: true

    - name: Remove node-specific bucket
      ansible.builtin.command:
        argv:
          - "{{ minio_client_bin }}"
          - --config-dir
          - /tmp/mc-molecule
          - rb
          - "molecule/{{ _anro_minio_verify_bucket }}"
      changed_when: true

    - name: Remove local E2E test files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/minio-molecule-source.txt
        - /tmp/minio-molecule-downloaded.txt
