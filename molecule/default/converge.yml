---
- name: Converge MinIO role
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: anro_minio
      vars:
        # Molecule-only credentials. Production has no default credentials.
        anro_minio_root_user: molecule-root
        anro_minio_root_password: molecule-only-password-change-me
        anro_minio_server_datadirs:
          - /data
        anro_minio_server_cluster_nodes:
          - http://minio-ubuntu2604-node0{1...4}:9000/data
