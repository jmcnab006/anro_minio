---
- name: Create MinIO data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ anro_minio_server_user }}"
    group: "{{ anro_minio_server_group }}"
    mode: "0750"
  loop: "{{ anro_minio_server_datadirs }}"

- name: Create MinIO configuration directory
  ansible.builtin.file:
    path: "{{ anro_minio_server_envfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure MinIO environment
  ansible.builtin.template:
    src: minio.env.j2
    dest: "{{ anro_minio_server_envfile }}"
    owner: root
    group: "{{ anro_minio_server_group }}"
    mode: "0640"
  no_log: true
  notify: Restart MinIO

- name: Create MinIO TLS directory
  ansible.builtin.file:
    path: "{{ anro_minio_tls_cert_dir }}"
    state: directory
    owner: "{{ anro_minio_server_user }}"
    group: "{{ anro_minio_server_group }}"
    mode: "0750"
  when: anro_minio_tls_enabled | bool

- name: Install MinIO TLS certificate
  ansible.builtin.copy:
    src: "{{ anro_minio_tls_cert_src }}"
    dest: "{{ anro_minio_tls_cert_dir }}/{{ anro_minio_tls_cert_file }}"
    owner: "{{ anro_minio_server_user }}"
    group: "{{ anro_minio_server_group }}"
    mode: "0644"
  when: anro_minio_tls_enabled | bool
  notify: Restart MinIO

- name: Install MinIO TLS private key
  ansible.builtin.copy:
    src: "{{ anro_minio_tls_key_src }}"
    dest: "{{ anro_minio_tls_cert_dir }}/{{ anro_minio_tls_key_file }}"
    owner: "{{ anro_minio_server_user }}"
    group: "{{ anro_minio_server_group }}"
    mode: "0600"
  no_log: true
  when: anro_minio_tls_enabled | bool
  notify: Restart MinIO

- name: Install hardened MinIO systemd unit
  ansible.builtin.template:
    src: minio.service.j2
    dest: "/etc/systemd/system/{{ anro_minio_server_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart MinIO

- name: Flush MinIO handlers before service enablement
  ansible.builtin.meta: flush_handlers

- name: Enable and start MinIO service
  ansible.builtin.systemd_service:
    name: "{{ anro_minio_server_service }}"
    enabled: true
    state: started
