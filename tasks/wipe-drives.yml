---
# Deliberately implemented with file state transitions rather than rm -rf. The double
# opt-in is validated before this task file can execute.
- name: Stop MinIO before destructive data wipe
  ansible.builtin.systemd_service:
    name: "{{ anro_minio_server_service }}"
    state: stopped
  failed_when: false
  when: anro_minio_configure_server | bool

- name: Remove MinIO data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ anro_minio_server_datadirs }}"

- name: Recreate empty MinIO data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ anro_minio_server_user }}"
    group: "{{ anro_minio_server_group }}"
    mode: "0750"
  loop: "{{ anro_minio_server_datadirs }}"
