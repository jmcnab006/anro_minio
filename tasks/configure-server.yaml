---
# Create our certs directory
- name: Create default certs directories
  ansible.builtin.file:
    path: "/home/{{ anro_minio_server_user }}/{{ item }}"
    state: directory
    owner: "{{ anro_minio_server_user }}"
    group: "{{ anro_minio_server_group }}"
    mode: "0700"
  with_items:
    - .minio/
    - .minio/certs
    - .minio/certs/CAs

# Block to enable custom certificates
- name: Add custom minio certificates
  notify:
    - Update CA
    - Restart minio
  when:
    - copy_minio_ssl_certificate is defined and copy_minio_ssl_certificate | length > 0
  block:
    - name: Create default certs extra directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "root"
        group: "root"
        mode: "0755"
      with_items:
        - /usr/local/share/ca-certificates/extra/

    - name: Copy TLS certificate to server
      ansible.builtin.copy:
        src: "{{ copy_minio_ssl_certificate }}"
        dest: "/home/{{ anro_minio_server_user }}/.minio/certs/public.crt"
        owner: "{{ anro_minio_server_user }}"
        group: "{{ anro_minio_server_group }}"
        mode: "0660"

    - name: Copy TLS private key to server
      ansible.builtin.copy:
        src: "{{ copy_minio_ssl_certificate_key }}"
        dest: "/home/{{ anro_minio_server_user }}/.minio/certs/private.key"
        owner: "{{ anro_minio_server_user }}"
        group: "{{ anro_minio_server_group }}"
        mode: "0660"

    - name: Copy CA to server
      ansible.builtin.copy:
        src: "{{ copy_minio_ssl_ca }}"
        dest: "/home/{{ anro_minio_server_user }}/.minio/certs/CAs/ca.crt"
        owner: "{{ anro_minio_server_user }}"
        group: "{{ anro_minio_server_group }}"
        mode: "0660"

    - name: Copy CA to server
      ansible.builtin.copy:
        src: "{{ anro_minio_ssl_ca }}"
        dest: "/usr/local/share/ca-certificates/extra/minio.crt"
        owner: "{{ anro_minio_server_user }}"
        group: "{{ anro_minio_server_group }}"
        mode: "0644"

    - name: Create a symbolic link to existing certificate
      ansible.builtin.file:
        src: "{{ anro_minio_ssl_certificate }}"
        dest: "/home/{{ anro_minio_server_user }}/.minio/certs/public.crt"
        state: link
        force: true

    - name: Create a symbolic link to existing key
      ansible.builtin.file:
        src: "{{ anro_minio_ssl_key }}"
        dest: "/home/{{ anro_minio_server_user }}/.minio/certs/private.key"
        state: link
        force: true

- name: Add minio user to ssl-cert group
  ansible.builtin.user:
    name: "{{ anro_minio_server_user }}"
    groups: "ssl-cert"
    append: true
  when:
    - existing_minio_ssl_certificate is defined and existing_minio_ssl_certificate | length > 0
    - existing_minio_ssl_certificate_key is defined and existing_minio_ssl_certificate_key | length > 0

- name: Generate the Minio server envfile
  ansible.builtin.template:
    src: minio.env.j2
    dest: "{{ anro_minio_server_envfile }}"
    owner: "root"
    group: "{{ anro_minio_server_group }}"
    mode: "0640"
  notify: Restart minio

- name: Create the Minio server systemd config
  ansible.builtin.template:
    src: minio.service.j2
    dest: "/etc/systemd/system/minio.service"
    owner: "root"
    group: "root"
    mode: "0644"
  when: ansible_service_mgr == "systemd"
  notify:
    - Reload minio systemd
    - Restart minio

- name: Enable and start the Minio service
  ansible.builtin.service:
    name: minio
    state: started
    enabled: true
