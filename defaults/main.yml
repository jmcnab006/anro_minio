---
# Installation controls. Server and client binaries are copied from files/bin/<arch>/.
anro_minio_install_server: true
anro_minio_install_client: true
anro_minio_configure_server: true

# Binary destinations on managed hosts.
anro_minio_server_bin: /usr/local/bin/minio
anro_minio_client_bin: /usr/local/bin/mc

# Dedicated unprivileged service identity.
anro_minio_server_user: minio
anro_minio_server_group: minio
anro_minio_server_user_shell: /usr/sbin/nologin
anro_minio_server_user_home: /var/lib/minio

# Service configuration.
anro_minio_server_envfile: /etc/default/minio
anro_minio_server_service: minio
anro_minio_server_address: ':9000'
anro_minio_console_address: ':9001'
anro_minio_server_datadirs:
  - /var/lib/minio
anro_minio_server_cluster_nodes: []

# REQUIRED when configuring the server. No insecure production defaults are supplied.
anro_minio_root_user: ''
anro_minio_root_password: ''

# Additional environment entries. Do not place secrets here unless inventory is Vault-protected.
# Values are quoted safely by the environment template.
anro_minio_server_env_extra: []

# TLS is opt-in. Supply controller-side certificate/key files when enabled.
anro_minio_tls_enabled: false
anro_minio_tls_cert_src: ''
anro_minio_tls_key_src: ''
anro_minio_tls_cert_dir: /etc/minio/certs
anro_minio_tls_cert_file: public.crt
anro_minio_tls_key_file: private.key

# Service hardening. Disable only after documenting a concrete compatibility requirement.
anro_minio_systemd_hardening: true

# Destructive operation protection. BOTH variables must be true to erase data directories.
anro_minio_wipe_all_drives: false
anro_minio_wipe_all_drives_confirm: false

# Optional packages needed by this role. ca-certificates supports TLS clients/health checks.
anro_minio_packages:
  - ca-certificates
