---
name: Test role
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install ansible-core==2.17.* ansible-lint molecule molecule-plugins[docker] docker
      - name: Run ansible-lint
        run: ansible-lint .
      - name: Run Molecule end-to-end test
        run: molecule test
